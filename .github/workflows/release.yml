name: release
# Manual only. Publishes with npm trusted publishing (OIDC): no npm token is stored anywhere, and every
# release carries a provenance statement. Set up a trusted publisher for each package on npmjs.com
# (repository jasonhnd/paseo-fleet, workflow release.yml) before the first run.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options: [kanban, fleet-cockpit, both]
        required: true
      dry_run:
        description: Run every gate and npm publish --dry-run, publish nothing
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write
concurrency: { group: release, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - run: node scripts/check-private.mjs --all --no-private-list
      - run: node scripts/check-identity.mjs --history --no-private-list
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: npm run typecheck
      - run: npm test
      - run: npm test --workspaces --if-present
      - run: node scripts/sync-contract.mjs --check
      - run: node scripts/check-package-files.mjs --print
      - name: Publish
        env:
          PACKAGES: ${{ inputs.package == 'both' && 'kanban fleet-cockpit' || inputs.package }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          for name in $PACKAGES; do
            npm publish --workspace "packages/$name" --access public --provenance $DRY_RUN
          done
